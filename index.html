<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <meta name="description" content="daily fun：精选 AI 前沿、设计灵感与生活兴趣，阅读摘要、观看视频并探索原始来源。">
  <title>daily fun</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232458d6'/%3E%3Ctext x='5' y='24' fill='white' font-family='Arial,sans-serif' font-size='25' font-weight='700'%3Ef%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#news">跳到日报内容</a>
  <div class="paper">
    <header class="masthead">
      <div class="edition-bar">
        <span class="publication-label">AI · DESIGN · LIFE</span>
        <time id="edition-date"></time>
        <span id="edition-mode">个人信息日报</span>
      </div>
      <div class="title-row">
        <h1 id="paper-name">daily fun<span class="name-dot" aria-hidden="true">.</span></h1>
        <p class="paper-intro">AI 前沿、设计灵感，<br>以及值得探索的日常。</p>
      </div>
      <div class="topic-bar">
        <nav id="categories" aria-label="按主题阅读"><button type="button" aria-pressed="true">全部</button></nav>
        <span id="item-count"></span>
      </div>
    </header>

    <main id="news" tabindex="-1">
      <div class="reading-note" id="reading-note" hidden>演示版 · 以下为内容与版式示例，并非当天新闻。</div>
      <p class="sr-only" id="status" role="status" aria-live="polite"></p>
      <section class="section-intro" id="frontier-intro" hidden>
        <h2>前沿交互</h2>
        <p>车联网 HMI · 智能座舱 · 具身智能 · 语音交互 · XR，聚焦 AI 与设计结合的方案、案例和经验。</p>
      </section>
      <div id="news-grid" class="news-grid" aria-busy="true">
        <div class="loading-state"><span></span><span></span><span></span><p>正在读取日报…</p></div>
      </div>
      <section id="message" class="message" hidden aria-live="polite">
        <h2 id="message-title"></h2>
        <p id="message-body"></p>
        <button type="button" id="retry">重新读取</button>
      </section>
      <section id="recommendations" class="recommendations" hidden aria-labelledby="recommendation-title">
        <div class="recommendation-heading">
          <div><span class="section-label">FOR YOU</span><h2 id="recommendation-title">为你推荐</h2></div>
          <button type="button" id="clear-history">清除阅读记录</button>
        </div>
        <p id="recommendation-note"></p>
        <div id="recommendation-grid" class="recommendation-grid"></div>
        <p class="history-note" id="history-note"></p>
      </section>
    </main>

    <footer class="paper-footer">
      <span id="footer-name">daily fun</span>
      <p>每一条信息，都有出处。</p>
      <a href="#top" id="back-top">回到顶部 ↑</a>
    </footer>
  </div>

  <template id="article-template">
    <article class="news-item">
      <div class="item-image" hidden><img loading="lazy" decoding="async" alt=""></div>
      <div class="card-body">
        <div class="item-meta"><span class="item-category"></span><span class="item-type"></span></div>
        <div class="item-content">
          <h2 class="item-title"><a class="card-link" target="_blank" rel="noopener noreferrer"></a></h2>
          <p class="item-brief"></p>
          <details class="item-detail"><summary>展开摘要 <span aria-hidden="true">+</span></summary><p class="item-summary"></p></details>
        </div>
        <div class="item-bottom"><a class="source-link" target="_blank" rel="noopener noreferrer"><span class="source-name"></span><span class="source-action">阅读原文 ↗</span></a></div>
      </div>
    </article>
  </template>
</body>
</html>
